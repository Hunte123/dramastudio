<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DramaStudio — 短剧批量视频生成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro','PingFang SC',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#161b22;border-bottom:1px solid #30363d}
.header h1{font-size:18px;font-weight:600}
.header h1 span{color:#f85149}
.badge{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge.dry{background:#1a3a2a;color:#3fb950}
.badge.live{background:#3a1a1a;color:#f85149}
.container{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
@media(max-width:768px){.container{grid-template-columns:1fr}}
.panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px}
.panel h2{font-size:14px;font-weight:600;color:#8b949e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
textarea,.input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical}
textarea{min-height:80px}
textarea:focus,.input:focus{outline:none;border-color:#58a6ff}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-secondary{background:#21262d;color:#58a6ff;border:1px solid #30363d}
.btn-secondary:hover{background:#30363d}
.btn-danger{background:#da3633;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.upload-zone{border:2px dashed #30363d;border-radius:8px;padding:20px;text-align:center;color:#8b949e;font-size:13px;cursor:pointer;transition:.15s;margin-bottom:12px}
.upload-zone:hover{border-color:#58a6ff;color:#58a6ff}
.upload-zone.has-img{border-style:solid;border-color:#238636}
.thumb{max-width:100%;max-height:120px;border-radius:6px;margin-top:8px}
.stats-bar{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;text-align:center}
.stat .num{font-size:22px;font-weight:700}
.stat .label{font-size:11px;color:#8b949e;margin-top:4px}
.stat.pending .num{color:#d29922}
.stat.running .num{color:#58a6ff}
.stat.done .num{color:#3fb950}
.stat.failed .num{color:#f85149}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-card{display:flex;gap:14px;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:14px;align-items:flex-start}
.task-card .img-box{width:72px;height:96px;background:#161b22;border-radius:6px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-card .img-box img{width:100%;height:100%;object-fit:cover}
.task-card .img-box .no-img{font-size:10px;color:#484f58;text-align:center;padding:4px}
.task-info{flex:1;min-width:0}
.task-prompt{font-size:13px;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px}
.task-meta{font-size:11px;color:#8b949e;display:flex;gap:12px;align-items:center}
.task-status{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.task-status.pending{background:#3a2d0a;color:#d29922}
.task-status.running{background:#0c2d4a;color:#58a6ff;animation:pulse 1.5s infinite}
.task-status.done{background:#1a3a2a;color:#3fb950}
.task-status.failed{background:#3a1a1a;color:#f85149}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.task-actions{display:flex;gap:6px;margin-top:8px}
.video-player{width:100%;max-width:280px;border-radius:8px;margin-top:8px}
.batch-area{margin-top:16px}
.batch-area textarea{min-height:120px;font-family:'SF Mono',monospace;font-size:12px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:1000;animation:slideIn .3s}
.toast.ok{background:#1a3a2a;color:#3fb950;border:1px solid #238636}
.toast.err{background:#3a1a1a;color:#f85149;border:1px solid:#da3633}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.tab-bar{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid #30363d}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent}
.tab.active{color:#e6edf3;border-bottom-color:#f85149}
.tab:hover{color:#e6edf3}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header">
<h1>Drama<span>Studio</span> — 短剧批量视频生成</h1>
<span id="modeBadge" class="badge dry">模拟模式</span>
</div>

<div class="container">
<!-- 左侧：创建任务 -->
<div class="panel">
<h2>创建任务</h2>
<div class="tab-bar">
<div class="tab active" onclick="switchTab('single')">单个添加</div>
<div class="tab" onclick="switchTab('batch')">批量导入</div>
</div>

<div id="tab-single">
<div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
点击上传首帧图（可选）
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleUpload(event)">
</div>
<img id="uploadThumb" class="thumb hidden" alt="">
<input type="hidden" id="imagePath" value="">

<textarea id="prompt" class="input" style="margin-top:10px" placeholder="视频描述prompt（必填）…&#10;例：镜头缓缓推近：年轻男人猛然坐起大口喘气，清晨阳光"></textarea>
<br><br>
<button class="btn btn-primary" style="width:100%" onclick="createTask()" id="btnCreate">添加到队列</button>
</div>

<div id="tab-batch" class="hidden">
<div class="batch-area">
<textarea id="batchInput" class="input" placeholder='批量导入JSON格式：&#10;[&#10;  {"prompt":"镜头推近：男人坐起喘气","image_path":"uploads/xxx.png"}&#10;  {"prompt":"镜头拉远：走廊全景"}&#10;]&#10;&#10;image_path可选，对应已上传的图片'></textarea>
<br><br>
<button class="btn btn-primary" style="width:100%" onclick="batchCreate()">批量添加</button>
</div>
</div>
</div>

<!-- 右侧：任务面板 -->
<div>
<div class="stats-bar">
<div class="stat pending"><div class="num" id="statPending">0</div><div class="label">待生成</div></div>
<div class="stat running"><div class="num" id="statRunning">0</div><div class="label">生成中</div></div>
<div class="stat done"><div class="num" id="statDone">0</div><div class="label">已完成</div></div>
<div class="stat failed"><div class="num" id="statFailed">0</div><div class="label">失败</div></div>
</div>

<div class="panel">
<h2>任务队列</h2>
<div class="task-list" id="taskList">
<div style="text-align:center;color:#484f58;padding:40px 0">暂无任务，先在左侧创建</div>
</div>
</div>
</div>
</div>

<script>
let tasks = [];
let stats = {};
let pollTimer = null;

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
    refresh();
    pollTimer = setInterval(refresh, 3000); // 3秒自动刷新
});

async function refresh() {
    try {
        const [tasksRes, statsRes] = await Promise.all([
            fetch('/api/tasks'), fetch('/api/stats')
        ]);
        tasks = (await tasksRes.json()).tasks || [];
        stats = await statsRes.json();
        renderStats();
        renderTasks();
        const badge = document.getElementById('modeBadge');
        if (stats.dry_run) {
            badge.textContent = '模拟模式（不烧额度）';
            badge.className = 'badge dry';
        } else {
            badge.textContent = '真实模式（消耗额度）';
            badge.className = 'badge live';
        }
    } catch(e) { console.error(e); }
}

function renderStats() {
    document.getElementById('statPending').textContent = stats.pending || 0;
    document.getElementById('statRunning').textContent = stats.running || 0;
    document.getElementById('statDone').textContent = stats.done || 0;
    document.getElementById('statFailed').textContent = stats.failed || 0;
}

function renderTasks() {
    const list = document.getElementById('taskList');
    if (!tasks.length) {
        list.innerHTML = '<div style="text-align:center;color:#484f58;padding:40px 0">暂无任务，先在左侧创建</div>';
        return;
    }
    list.innerHTML = tasks.map(t => {
        const img = t.image_path ? `<img src="/files/${t.image_path}" loading="lazy">` : '<span class="no-img">无首帧图</span>';
        const video = t.status === 'done' && t.video_path ? `<video class="video-player" controls preload="none" src="/files/${t.video_path}"></video>` : '';
        const err = t.error ? `<div style="font-size:11px;color:#f85149;margin-top:4px">${t.error}</div>` : '';
        const time = new Date(t.created_at).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        return `<div class="task-card">
<div class="img-box">${img}</div>
<div class="task-info">
<div class="task-prompt">${escHtml(t.prompt)}</div>
<div class="task-meta">
<span class="task-status ${t.status}">${statusText(t.status)}</span>
<span>${time}</span>
<span>#${t.id}</span>
</div>
${err}${video}
<div class="task-actions">
<button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">删除</button>
</div>
</div>
</div>`;
    }).join('');
}

// ── 操作 ──

async function createTask() {
    const prompt = document.getElementById('prompt').value.trim();
    const imagePath = document.getElementById('imagePath').value;
    if (!prompt) { toast('请填写prompt', 'err'); return; }
    const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt, image_path: imagePath})
    });
    if (res.ok) {
        document.getElementById('prompt').value = '';
        document.getElementById('imagePath').value = '';
        document.getElementById('uploadThumb').classList.add('hidden');
        document.getElementById('uploadZone').classList.remove('has-img');
        toast('已添加到队列');
        refresh();
    } else {
        const err = await res.json();
        toast(err.error || '创建失败', 'err');
    }
}

async function batchCreate() {
    const raw = document.getElementById('batchInput').value.trim();
    if (!raw) { toast('请输入JSON数组', 'err'); return; }
    try {
        const arr = JSON.parse(raw);
        const res = await fetch('/api/tasks/batch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(arr)
        });
        const out = await res.json();
        if (res.ok) {
            toast(`已添加 ${out.created} 条任务`);
            document.getElementById('batchInput').value = '';
            refresh();
        } else {
            toast(out.error || '批量导入失败', 'err');
        }
    } catch(e) {
        toast('JSON格式错误', 'err');
    }
}

async function deleteTask(id) {
    await fetch(`/api/tasks/${id}`, {method: 'DELETE'});
    refresh();
}

async function handleUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('image', file);
    const res = await fetch('/api/upload', {method: 'POST', body: fd});
    const out = await res.json();
    if (res.ok) {
        document.getElementById('imagePath').value = out.path;
        document.getElementById('uploadThumb').src = '/files/' + out.path;
        document.getElementById('uploadThumb').classList.remove('hidden');
        document.getElementById('uploadZone').classList.add('has-img');
        document.getElementById('uploadZone').textContent = '已上传 ✓（点击更换）';
    }
}

// ── 工具 ──

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-single').classList.add('hidden');
    document.getElementById('tab-batch').classList.add('hidden');
    document.getElementById('tab-' + tab).classList.remove('hidden');
    event.target.classList.add('active');
}

function statusText(s) {
    return {pending:'待生成', running:'生成中', done:'已完成', failed:'失败'}[s] || s;
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
